<style>
:root{
  --bg:#F7F2EA; --bg2:#EEE5D8; --card:#FFFDF9; --ink:#3E2D24; --ink2:#8C7666; --line:#E2D6C6;
  --ac:#B08D57; --ac-d:#86683A; --ac-l:#D9C29A; --ac-xl:#F4EDE0;
  --blush:#F4BFB2; --red:#D9776B; --ok:#7FA27A;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);
  font-family:-apple-system,"PingFang TC","Noto Sans CJK TC",sans-serif;overscroll-behavior:none}
html{background:var(--bg)}
body{padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none;
  background:radial-gradient(120% 60% at 50% 0%, var(--card) 0%, var(--bg) 70%) fixed}
.screen{display:none;min-height:100%;flex-direction:column;align-items:center;padding:22px 0 26px}
.screen.on{display:flex}
h1{font-size:32px;font-weight:800;margin:14px 0 2px;white-space:nowrap;letter-spacing:4px}
.eyebrow{font-size:12px;letter-spacing:4px;color:var(--ink2);font-weight:600;margin-top:4px}
.sub{font-size:18px;line-height:1.7;text-align:center;margin:10px 8px 0;color:var(--ink2)}
.sub b{color:var(--ink)}
.big-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:350px;
  min-height:76px;margin-top:18px;border:none;border-radius:26px;
  background:linear-gradient(180deg,var(--ac) 0%,var(--ac-d) 100%);
  color:#fff;font-size:25px;font-weight:700;letter-spacing:3px;
  box-shadow:0 12px 26px -10px var(--ac-d), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .12s ease}
.big-btn:active{transform:scale(.97)}
.big-btn.dark{background:linear-gradient(180deg,#5A4537 0%,var(--ink) 100%);box-shadow:0 12px 26px -12px var(--ink), inset 0 1px 0 rgba(255,255,255,.2)}
.big-btn.white{background:var(--card);color:var(--ink);border:1.5px solid var(--line);
  box-shadow:0 8px 20px -14px rgba(62,45,36,.5)}
.big-btn.small{min-height:62px;font-size:20px;letter-spacing:2px;margin-top:12px}
.big-btn svg{width:34px;height:34px;flex:none}
.card{width:100%;max-width:350px;background:rgba(255,253,249,.9);border:1px solid var(--line);border-radius:24px;
  padding:16px 20px 20px;margin-top:20px;box-shadow:0 14px 34px -22px rgba(62,45,36,.45)}
.card label{display:block;font-size:15px;font-weight:600;margin:12px 0 8px;color:var(--ink2);letter-spacing:1px}
.card input{width:100%;font-size:19px;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;
  background:#fff;color:var(--ink);font-family:inherit;user-select:text;-webkit-user-select:text;outline:none}
.card input:focus{border-color:var(--ac)}
.card input::placeholder{color:#C2B3A4}
.hint{font-size:14px;color:var(--ink2);margin-top:12px;line-height:1.5;letter-spacing:.5px}
.mascot{width:170px;height:170px}

/* 找人畫面 */
#find{justify-content:flex-start}
.find-title{font-size:24px;font-weight:800;margin-top:6px;white-space:nowrap;letter-spacing:3px}
.dial{position:relative;width:min(76vw,290px);height:min(76vw,290px);margin-top:18px;border-radius:50%;
  box-shadow:0 24px 50px -28px rgba(62,45,36,.55)}
.dial-bg{position:absolute;inset:0}
#arrow{position:absolute;inset:0;will-change:transform;transition:none}
#arrowWrap{transition:opacity .3s}
#arrowWrap.hide{opacity:.12}
#nearFace{position:absolute;inset:18%;display:none}
.dist{font-size:60px;font-weight:800;line-height:1;margin-top:22px;white-space:nowrap;letter-spacing:1px;font-variant-numeric:tabular-nums}
.dist small{font-size:22px;font-weight:600;margin-left:6px;color:var(--ink2);letter-spacing:2px}
.say{font-size:27px;font-weight:700;margin-top:12px;min-height:38px;color:var(--ac-d);white-space:nowrap;letter-spacing:3px}
.meta{font-size:13px;color:var(--ink2);margin-top:8px;text-align:center;min-height:18px;letter-spacing:.5px}
.row{display:flex;gap:12px;width:100%;max-width:350px}
.row .big-btn{flex:1}
.status-pill{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:6px 14px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);margin-top:10px;color:var(--ink2);letter-spacing:1px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(127,162,122,.18)}
.dot.wait{background:var(--ac)} .dot.bad{background:var(--red)}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:14px;padding:8px 16px;color:var(--ink2);
  border-radius:99px;border:1px solid var(--line);background:var(--card);letter-spacing:1px}
.toggle svg{width:22px;height:22px}
.share-box{width:100%;max-width:350px}

/* 開機畫面 */
#boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:50;transition:opacity .35s}
#boot .mascot{opacity:0;transform:scale(.7)}
#boot.go .mascot{animation:pop .7s cubic-bezier(.3,1.5,.5,1) forwards}
#boot .bt{font-size:30px;font-weight:800;margin-top:12px;opacity:0;letter-spacing:8px}
#boot .bs{font-size:12px;letter-spacing:5px;color:var(--ink2);margin-top:6px;opacity:0}
#boot.go .bt{animation:fadeup .6s .35s forwards}
#boot.go .bs{animation:fadeup .6s .5s forwards}
#boot.out{opacity:0;pointer-events:none}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.pulse{animation:breathe 1.8s ease-in-out infinite}

/* 視窗 */
.mask{position:fixed;inset:0;background:rgba(62,45,36,.35);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
.mask.on{display:flex}
.modal{position:relative;width:100%;max-width:350px;max-height:60vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:26px;padding:24px 22px 18px;box-shadow:0 30px 60px -30px rgba(62,45,36,.6)}
.modal h2{margin:0 0 10px;font-size:22px;letter-spacing:2px}
.modal .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border:none;background:none;padding:6px}
.modal ul{padding-left:20px;font-size:16px;line-height:1.7;margin:6px 0;color:var(--ink2)}
.ver{font-weight:700;margin-top:10px}
.foot{font-size:12px;color:var(--ink2);margin-top:auto;padding-top:24px;text-align:center;letter-spacing:1px;opacity:.8}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:16px;padding:12px 20px;border-radius:99px;opacity:0;letter-spacing:1px;
  transition:opacity .25s;z-index:60;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1}

/* 被擋時的圖解教學 */
.guide{max-height:80vh;padding:22px 18px 18px}
.guide h2{font-size:24px;margin:0 0 4px}
.guide .gsub{font-size:16px;color:var(--ink2);line-height:1.6;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin:10px 0 4px;background:var(--bg2);border-radius:14px;padding:4px}
.tabs button{flex:1;border:none;background:none;font-size:15px;padding:9px 0;border-radius:11px;color:var(--ink2);font-family:inherit;font-weight:600}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px -4px rgba(62,45,36,.4)}
.step{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:17px}
.step .t{font-size:19px;line-height:1.5;font-weight:600}
.step .t b{color:var(--ac-d)}
.mock{margin-top:8px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:16px;border-top:1px solid #F0EAE1}
.mrow:first-child{border-top:none}
.mrow .ic{width:26px;height:26px;border-radius:7px;flex:none}
.mrow .r{margin-left:auto;color:var(--ink2);font-size:14px}
.mrow.hl{background:var(--ac-xl);font-weight:700}
.sw{width:42px;height:26px;border-radius:99px;background:#65C466;position:relative;margin-left:auto}
.sw::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.gnote{font-size:14px;color:var(--ink2);margin-top:12px;line-height:1.6;background:var(--bg);border-radius:12px;padding:10px 12px}
.status-pill.tap{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<!-- 開機畫面 -->
<div id="boot">
  <svg class="mascot" viewBox="0 0 200 200" aria-hidden="true"><use href="#mascotSym"/></svg>
  <div class="bt">來找我</div>
  <div class="bs">FIND ME</div>
</div>

<!-- 共用 SVG -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="mascotSym" viewBox="0 0 200 200">
      <!-- 圓滾滾的定位針小人 -->
      <ellipse cx="100" cy="186" rx="38" ry="8" fill="#E6DACB"/>
      <path d="M100 178 C70 140 42 118 42 82 a58 58 0 0 1 116 0 c0 36 -28 58 -58 96z" fill="#B08D57" stroke="#3E2D24" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M62 70 a40 40 0 0 1 30 -32" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".45"/>
      <circle cx="100" cy="82" r="38" fill="#FFFDF9" stroke="#3E2D24" stroke-width="4"/>
      <circle cx="86" cy="80" r="5.5" fill="#3E2D24"/><circle cx="114" cy="80" r="5.5" fill="#3E2D24"/>
      <circle cx="88" cy="78" r="1.8" fill="#fff"/><circle cx="116" cy="78" r="1.8" fill="#fff"/>
      <ellipse cx="76" cy="93" rx="7" ry="4.5" fill="#F4BFB2"/><ellipse cx="124" cy="93" rx="7" ry="4.5" fill="#F4BFB2"/>
      <path d="M92 94 q8 8 16 0" fill="none" stroke="#3E2D24" stroke-width="4" stroke-linecap="round"/>
      <path d="M150 36 l10 -10 M160 52 l14 -2 M140 22 l2 -14" stroke="#3E2D24" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="icPin" viewBox="0 0 40 40"><path d="M20 37 C12 27 7 22 7 15 a13 13 0 0 1 26 0 c0 7 -5 12 -13 22z" fill="#fff" stroke="#3E2D24" stroke-width="3"/><circle cx="20" cy="15" r="5" fill="#B08D57" stroke="#3E2D24" stroke-width="2.5"/></symbol>
    <symbol id="icGo" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#fff" stroke="#3E2D24" stroke-width="3"/><path d="M20 9 L28 27 L20 22 L12 27z" fill="#B08D57" stroke="#3E2D24" stroke-width="2.5" stroke-linejoin="round"/></symbol>
    <symbol id="icShare" viewBox="0 0 40 40"><rect x="7" y="16" width="26" height="20" rx="5" fill="#fff" stroke="#3E2D24" stroke-width="3"/><path d="M20 26 V5 M13 11 l7 -7 7 7" fill="none" stroke="#3E2D24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icCopy" viewBox="0 0 40 40"><rect x="12" y="12" width="21" height="23" rx="5" fill="#fff" stroke="#3E2D24" stroke-width="3"/><rect x="6" y="5" width="21" height="23" rx="5" fill="#F4EDE0" stroke="#3E2D24" stroke-width="3"/></symbol>
    <symbol id="icPhone" viewBox="0 0 40 40"><path d="M11 5 l7 2 2 8 -5 3 c2 5 5 8 10 10 l3 -5 8 2 2 7 c-2 4 -6 5 -10 4 C17 33 7 23 5 12 c-1 -4 1 -6 6 -7z" fill="#fff" stroke="#3E2D24" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="icStop" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#fff" stroke="#3E2D24" stroke-width="3"/><path d="M14 14 l12 12 M26 14 l-12 12" stroke="#D9776B" stroke-width="4" stroke-linecap="round"/></symbol>
    <symbol id="icX" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#F4EDE0" stroke="#3E2D24" stroke-width="3"/><path d="M14 14 l12 12 M26 14 l-12 12" stroke="#3E2D24" stroke-width="4" stroke-linecap="round"/></symbol>
    <symbol id="icSpk" viewBox="0 0 40 40"><path d="M6 15 h7 l9 -8 v26 l-9 -8 h-7z" fill="#F4EDE0" stroke="#3E2D24" stroke-width="3" stroke-linejoin="round"/><path d="M27 14 q5 6 0 12 M31 9 q10 11 0 22" fill="none" stroke="#3E2D24" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="icMute" viewBox="0 0 40 40"><path d="M6 15 h7 l9 -8 v26 l-9 -8 h-7z" fill="#eee" stroke="#8C7666" stroke-width="3" stroke-linejoin="round"/><path d="M27 15 l10 10 M37 15 l-10 10" stroke="#8C7666" stroke-width="3" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<!-- 首頁（分享的人） -->
<section class="screen" id="home">
  <svg class="mascot bob" viewBox="0 0 200 200"><use href="#mascotSym"/></svg>
  <div class="eyebrow">FIND ME</div>
  <h1>來找我</h1>
  <div class="sub">傳一個連結給家人<br>他們跟著<b>大箭頭</b>走，就會走到你身邊</div>
  <div class="card">
    <label for="myName">對方要怎麼叫你？</label>
    <input id="myName" maxlength="8" placeholder="例如：兒子">
    <label for="myPhone">你的手機號碼（選填）</label>
    <input id="myPhone" type="tel" inputmode="tel" maxlength="15" placeholder="對方畫面會有「打給你」按鈕">
  </div>
  <button class="big-btn" id="btnCreate"><svg><use href="#icPin"/></svg>開始分享位置</button>
  <div class="hint" style="max-width:360px;text-align:center">連結 2 小時後失效，按「結束」就刪除位置</div>
  <div class="foot">Copyright © 2026 大樹・<span class="vtxt"></span></div>
</section>

<!-- 對方打開連結的歡迎畫面 -->
<section class="screen" id="welcome">
  <svg class="mascot bob" viewBox="0 0 200 200"><use href="#mascotSym"/></svg>
  <h1 id="welTitle">兒子在等你</h1>
  <div class="sub">按下面的大按鈕<br>然後<b>跟著箭頭走</b>就好</div>
  <button class="big-btn pulse" id="btnStart" style="min-height:104px;font-size:32px"><svg style="width:44px;height:44px"><use href="#icGo"/></svg>開始找</button>
  <div class="card" style="font-size:17px;line-height:1.6">
    手機會問兩次「允許嗎？」<br>都請按 <b>「允許」</b>
  </div>
  <div class="foot">Copyright © 2026 大樹・<span class="vtxt"></span></div>
</section>

<!-- 連結失效 -->
<section class="screen" id="expired">
  <svg class="mascot" viewBox="0 0 200 200"><use href="#mascotSym"/></svg>
  <h1>連結過期了</h1>
  <div class="sub">請對方再傳一次新的連結</div>
  <button class="big-btn white" id="btnGoHome">回首頁</button>
</section>

<!-- 找人畫面（兩邊共用） -->
<section class="screen" id="find">
  <div class="find-title" id="findTitle">跟著箭頭走</div>
  <div class="status-pill"><span class="dot wait" id="dot"></span><span id="statusTxt">連線中…</span></div>
  <div class="dial">
    <svg class="dial-bg" viewBox="0 0 300 300">
      <defs>
        <radialGradient id="dialFill" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3ECE2"/></radialGradient>
      </defs>
      <circle cx="150" cy="150" r="146" fill="url(#dialFill)" stroke="#E2D6C6" stroke-width="1.5"/>

<script type="module">
// ===== 版本與改版紀錄 =====
const APP_VERSION = '1.0.0';
const CHANGELOG = [
  { v:'1.0.0', items:['第一版上線：分享位置、跟著箭頭走、距離與語音提示、打電話按鈕'] },
];

// ===== Firebase 設定 =====
const firebaseConfig = {
  apiKey: "AIzaSyDPl-z9JVKiBtpwHUe6FJ2-GRuUbY5wnnQ",
  authDomain: "find-me-2ee50.firebaseapp.com",
  databaseURL: "https://find-me-2ee50-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "find-me-2ee50",
  storageBucket: "find-me-2ee50.firebasestorage.app",
  messagingSenderId: "762332795292",
  appId: "1:762332795292:web:31f16ccafe63ab29f9b859"
};

// ===== 全域狀態（開機就會用到，先宣告避免 TDZ） =====
const $ = id => document.getElementById(id);
const ROOM_TTL = 2*60*60*1000;      // 房間 2 小時失效
const STALE_MS = 30*1000;           // 對方 30 秒沒更新 → 顯示斷線
const WRITE_MS = 2000;              // 每 2 秒最多寫一次
const NEAR_M = 15;                  // 15 公尺內算「到了」
let db = null, fb = null;
let role = null;        // 'a' = 分享的人, 'b' = 打開連結的人
let roomId = null, roomCreated = 0;
let me = null, other = null;        // {lat,lng,acc,t}
let heading = null, smoothHead = null, shownRot = 0;
let lastWrite = 0, watchId = null, unsub = null;
let voiceOn = true, lastSpeak = 0, lastSaid = '', arrived = false;
let audioCtx = null, wakeLock = null, busy = false;
let otherName = '對方';
let gpsErr = null;

const ls = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

document.querySelectorAll('.vtxt').forEach(e=>e.textContent='v'+APP_VERSION);

// ===== 小工具 =====
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1800); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); }
function randId(n=24){
  const abc='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a=new Uint32Array(n); crypto.getRandomValues(a);
  return Array.from(a, x=>abc[x%abc.length]).join('');
}
const rad = d=>d*Math.PI/180, deg = r=>r*180/Math.PI;
function distM(a,b){
  const R=6371000, dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
  const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat));
  const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));
  return (deg(Math.atan2(y,x))+360)%360;
}
const wrap180 = d=>((d%360)+540)%360-180;
function fmtDist(m){
  if(m<1000) return {n:String(Math.round(m/5)*5||Math.round(m)), u:'公尺'};
  return {n:(m/1000).toFixed(1), u:'公里'};
}
function speakNum(m){ return m<1000 ? `${Math.round(m/10)*10||Math.round(m)}公尺` : `${(m/1000).toFixed(1)}公里`; }

// ===== 音效 =====
function initAudio(){
  if(audioCtx) return;
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'playback'}); }catch(e){}
}
function ding(freqs=[880,1320]){
  if(!audioCtx) return;
  try{
    const t0=audioCtx.currentTime;
    freqs.forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+i*0.15); g.gain.exponentialRampToValueAtTime(0.25,t0+i*0.15+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.15+0.5);
      o.connect(g).connect(audioCtx.destination); o.start(t0+i*0.15); o.stop(t0+i*0.15+0.55);
    });
  }catch(e){}
}
function speak(text, force=false){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  const now=Date.now();
  if(!force && (now-lastSpeak<8000 || (text===lastSaid && now-lastSpeak<15000))) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=0.9;
    speechSynthesis.speak(u); lastSpeak=now; lastSaid=text;
  }catch(e){}
}

// ===== 權限（一定要在使用者點擊時呼叫） =====
async function askCompass(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const r = await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){ openGuide('compass'); return; }
    }
  }catch(e){}
  const handler = e=>{
    let h=null;
    if(typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading;   // iPhone 直接給
    else if(e.absolute && typeof e.alpha==='number') h=(360-e.alpha)%360;      // Android
    if(h===null) return;
    const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    h=(h+so+360)%360;
    // 低通濾波（像 IIR filter），處理 359→0 的繞圈
    smoothHead = smoothHead===null ? h : (smoothHead + wrap180(h-smoothHead)*0.25 + 360)%360;
    heading = smoothHead;
  };
  window.addEventListener('deviceorientationabsolute', handler);
  window.addEventListener('deviceorientation', handler);
}
function startGPS(){
  if(!('geolocation' in navigator)){ setStatus('bad','這支手機不支援定位'); return; }
  watchId = navigator.geolocation.watchPosition(p=>{
    gpsErr = null;
    me = {lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy||0), t:Date.now()};
    pushMe();
  }, err=>{
    gpsErr = err.code;
    if(err.code===1){ setStatus('bad','定位被關掉了，點這裡看怎麼開'); openGuide('loc'); }
    else if(err.code===3) setStatus('wait','GPS 訊號弱，請到戶外');
    else { setStatus('bad','拿不到位置，點這裡看怎麼開'); openGuide('loc'); }
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
}
async function keepAwake(){
  try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){}
}

// ===== Firebase =====
async function initDb(){
  if(db) return true;
  try{
    const [appMod, dbMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js')
    ]);
    const app = appMod.initializeApp(firebaseConfig);
    db = dbMod.getDatabase(app); fb = dbMod;
    return true;
  }catch(e){ console.warn(e); setStatus('bad','連不上伺服器，請檢查網路'); return false; }
}
function pushMe(){
  if(!db || !me || !roomId) return;
  const now=Date.now();
  if(now-lastWrite<WRITE_MS) return;
  lastWrite=now;
  fb.set(fb.ref(db, `rooms/${roomId}/${role}`), me).catch(e=>console.warn(e));
}
function listenOther(){
  const otherKey = role==='a'?'b':'a';
  unsub = fb.onValue(fb.ref(db, `rooms/${roomId}/${otherKey}`), snap=>{
    const v=snap.val();
    other = (v && typeof v.lat==='number') ? v : null;
  });
}

// ===== 畫面更新迴圈 =====
function setStatus(cls, txt){ $('dot').className='dot '+cls; $('statusTxt').textContent=txt;
  document.querySelector('#find .status-pill').classList.toggle('tap', cls==='bad' && (gpsErr===1||gpsErr===2)); }
function tick(){
  requestAnimationFrame(tick);
  if(!$('find').classList.contains('on')) return;
  const now=Date.now();
  if(role==='a' && now-roomCreated>ROOM_TTL){ endRoom(); show('expired'); return; }

  if(!me){ $('arrowWrap').classList.add('hide'); if(gpsErr===null) setStatus('wait','正在找你的位置…'); $('dist').innerHTML='--'; $('say').textContent=''; $('meta').textContent=''; return; }
  if(!other){
    setStatus('wait', role==='a' ? `等${otherName}打開連結…` : `等${otherName}的位置…`);
    $('dist').innerHTML='--'; $('say').textContent=''; $('meta').textContent=`你的 GPS 誤差約 ${me.acc} 公尺`;
    $('arrowWrap').classList.add('hide'); return;
  }
  const age = now-other.t;
  if(age>STALE_MS) setStatus('bad', `${otherName}的位置 ${Math.round(age/1000)} 秒沒更新`);
  else setStatus('ok', `已連上${otherName}`);
  if(role==='a') $('shareBox').style.display='none';

  const d = distM(me, other);
  const err = Math.max(me.acc||0, other.acc||0);
  const isNear = d < Math.max(NEAR_M, Math.min(err, 30));
  $('arrowWrap').classList.remove('hide');

  if(isNear){
    $('arrowWrap').style.display='none'; $('nearFace').style.display='block';
    $('dist').innerHTML='就在附近！';
    $('say').textContent='看看四周，揮揮手';
    if(!arrived){ arrived=true; ding([784,988,1318]); speak(`${otherName}就在附近，看看四周`, true); if(navigator.vibrate) navigator.vibrate([200,100,200]); }
  }else{
    if(arrived && d > NEAR_M+15) arrived=false;
    $('arrowWrap').style.display=''; $('nearFace').style.display='none';
    const f=fmtDist(d); $('dist').innerHTML=`${f.n}<small>${f.u}</small>`;
    const b = bearing(me, other);
    if(heading===null){
      $('say').textContent='手機拿平，慢慢轉一圈';
      setRot(b);   // 沒有羅盤：箭頭以「北方朝上」顯示
    }else{
      const rel = wrap180(b-heading);
      setRot(rel);
      let s;
      if(Math.abs(rel)<=30) s='往前走';
      else if(Math.abs(rel)>=150) s='往後轉';
      else s = rel>0 ? '往右轉' : '往左轉';
      $('say').textContent=s;
      speak(s==='往前走' ? `往前走，還有${speakNum(d)}` : s);
    }
  }
  $('meta').textContent = `GPS 誤差約 ${err} 公尺・${Math.max(0,Math.round(age/1000))} 秒前更新`;
}
function setRot(target){
  shownRot += wrap180(target-shownRot)*0.2;   // 平滑轉動，不會亂跳
  $('arrow').style.transform=`rotate(${shownRot}deg)`;
}

// ===== 流程 =====
function shareUrl(){
  const u = new URL(location.origin + location.pathname);
  u.searchParams.set('r', roomId);
  u.searchParams.set('c', String(roomCreated));
  const n = ($('myName').value||'').trim(); if(n) u.searchParams.set('n', n);
  const p = ($('myPhone').value||'').replace(/[^\d+]/g,''); if(p) u.searchParams.set('p', p);
  u.searchParams.set('openExternalBrowser','1');   // 從 LINE 點開時，改用 Safari 開啟
  return u.toString();
}
async function startAsSharer(resume){
  if(busy) return; busy=true;
  initAudio(); speak('',true);
  ls.set('fm_name', ($('myName').value||'').trim());
  ls.set('fm_phone', ($('myPhone').value||'').trim());
  role='a';
  if(resume){ roomId=resume.id; roomCreated=resume.c; }
  else { roomId=randId(); roomCreated=Date.now(); ls.set('fm_room',{id:roomId,c:roomCreated}); }
  otherName='對方';
  $('findTitle').textContent='對方會跟著箭頭找你';
  $('shareBox').style.display='';
  $('btnCall').style.display='none';
  show('find');
  startGPS(); askCompass(); keepAwake();
  if(await initDb()){ listenOther(); pushMe(); }
  busy=false;
}
async function startAsFinder(){
  if(busy) return; busy=true;
  initAudio(); speak('',true);
  role='b'; show('find');
  $('shareBox').style.display='none';
  startGPS(); askCompass(); keepAwake();
  if(await initDb()){ listenOther(); pushMe(); }
  speak(`跟著箭頭走，就會找到${otherName}`, true);
  busy=false;
}
async function endRoom(){
  try{
    if(watchId!==null) navigator.geolocation.clearWatch(watchId);
    if(unsub) unsub();
    if(db && roomId){
      await fb.remove(fb.ref(db, `rooms/${roomId}/${role}`));
      if(role==='a') await fb.remove(fb.ref(db, `rooms/${roomId}/b`)).catch(()=>{});
    }
  }catch(e){}
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  watchId=null; unsub=null; me=null; other=null; arrived=false;
  if(role==='a') ls.del('fm_room');
}

// ===== 按鈕 =====
let resumeRoom = null;
$('btnCreate').addEventListener('click', ()=>{ ding([660]); startAsSharer(resumeRoom); });
$('btnStart').addEventListener('click', ()=>{ ding([660]); startAsFinder(); });
$('btnGoHome').addEventListener('click', ()=>{ location.replace(location.pathname); });
$('btnShare').addEventListener('click', async ()=>{
  const url=shareUrl();
  const nm=($('myName').value||'').trim()||'我';
  const text=`${nm}在這裡等你，點連結後按「開始找」，跟著箭頭走就到了：`;
  try{
    if(navigator.share){ await navigator.share({title:'來找我', text, url}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  location.href='https://line.me/R/msg/text/?'+encodeURIComponent(text+'\n'+url);
});
$('btnCopy').addEventListener('click', async ()=>{
  try{ await navigator.clipboard.writeText(shareUrl()); toast('已複製連結'); }catch(e){ toast('複製失敗，請改用分享'); }
});
$('btnEnd').addEventListener('click', async ()=>{
  if(!confirmEnd()) return;
  await endRoom(); speechSynthesis && speechSynthesis.cancel();
  location.replace(location.pathname);
});
function confirmEnd(){ return true; }
$('btnVoice').addEventListener('click', ()=>{
  voiceOn=!voiceOn; ls.set('fm_voice', voiceOn); renderVoice();
  if(!voiceOn){ try{ speechSynthesis.cancel(); }catch(e){} }
});
function renderVoice(){
  $('voiceTxt').textContent='語音提示：'+(voiceOn?'開':'關');
  $('voiceIc').innerHTML=`<use href="#${voiceOn?'icSpk':'icMute'}"/>`;
}


// ===== 被擋時的圖解教學 =====
const UA = navigator.userAgent || '';
const ENV = {
  os: /iPhone|iPad|iPod/.test(UA) ? 'ios' : (/Android/.test(UA) ? 'android' : 'ios'),
  br: /Line\//i.test(UA) ? 'line' : /CriOS/.test(UA) ? 'chrome' : /FxiOS/.test(UA) ? 'firefox'
      : /SamsungBrowser/.test(UA) ? 'samsung' : /Android/.test(UA) ? 'chrome' : 'safari'
};
let guideKind = null, guideOs = ENV.os, compassPending = false;
const icon = c=>`<span class="ic" style="background:${c}"></span>`;
function stepsHtml(kind, os){
  const st=(n,t,mock='')=>`<div class="step"><div class="n">${n}</div><div style="flex:1"><div class="t">${t}</div>${mock}</div></div>`;
  if(kind==='line'){
    return st(1,'點右下角的 <b>⋯</b>（或右上角）')
         + st(2, os==='ios' ? '選 <b>「以 Safari 開啟」</b>' : '選 <b>「以其他應用程式開啟」</b> → Chrome')
         + st(3,'在新打開的網頁按 <b>「開始找」</b>');
  }
  if(kind==='compass'){
    return os==='ios'
      ? st(1,'把這個網頁<b>關掉</b>') + st(2,'回到 LINE <b>再點一次連結</b>') + st(3,'問「動作與方向」時按 <b>「允許」</b>')
        + '<div class="gnote">沒開羅盤也能用：距離照樣會顯示，只是箭頭不會跟著你轉。</div>'
      : st(1,'Android 不用另外允許羅盤') + st(2,'把手機<b>拿平</b>，在空中畫 8 字校正')
        + '<div class="gnote">箭頭亂轉通常是羅盤沒校正，畫幾次 8 字就會好。</div>';
  }
  // 定位
  if(os==='ios'){
    const app = ENV.br==='chrome' ? 'Chrome' : ENV.br==='firefox' ? 'Firefox' : 'Safari 網站';
    return st(1,'打開手機的 <b>「設定」</b>', `<div class="mock"><div class="mrow">${icon('#8E8E93')}設定</div></div>`)
      + st(2,'點 <b>「隱私權與安全性」</b> → <b>「定位服務」</b>，最上面的開關要<b>打開</b>',
          `<div class="mock"><div class="mrow">${icon('#3478F6')}隱私權與安全性<span class="r">›</span></div><div class="mrow hl">${icon('#3478F6')}定位服務<span class="sw"></span></div></div>`)
      + st(3,`往下找 <b>「${app}」</b>，改成 <b>「使用 App 期間」</b>`,
          `<div class="mock"><div class="mrow hl">${icon(ENV.br==='chrome'?'#34A853':'#3478F6')}${app}<span class="r">使用 App 期間 ›</span></div></div>`)
      + st(4,'回到這裡，按下面的 <b>「再試一次」</b>')
      + `<div class="gnote">如果還是不行：點網址列左邊的「<b>大小</b>」圖示 →「網站設定」→「位置」→ 選「<b>允許</b>」。</div>`;
  }
  return st(1,'從螢幕最上面<b>往下滑</b>，打開 <b>「定位」</b>（或「位置」）',
        `<div class="mock"><div class="mrow hl">${icon('#3478F6')}定位<span class="sw"></span></div></div>`)
    + st(2,'點網址列左邊的 <b>小圖示</b> → <b>「權限」</b> → <b>「位置」</b>',
        `<div class="mock"><div class="mrow">${icon('#5F6368')}權限<span class="r">›</span></div><div class="mrow hl">${icon('#5F6368')}位置<span class="r">允許</span></div></div>`)
    + st(3,'改成 <b>「允許」</b>，再按下面的 <b>「再試一次」</b>');
}
function renderGuide(){
  const t={loc:['位置被關掉了','照下面做一次，以後就不用再設定'],
           compass:['羅盤沒有打開','箭頭會不準，照下面做就好'],
           line:['請改用瀏覽器打開','LINE 裡面沒辦法用定位']}[guideKind];
  $('gTitle').textContent=t[0]; $('gSub').textContent=t[1];
  $('gTabs').style.display = guideKind==='line' ? 'none' : '';
  $('gTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.os===guideOs));
  $('gBody').innerHTML = stepsHtml(guideKind, guideOs);
  $('gRetry').style.display = guideKind==='loc' ? '' : 'none';
}
function openGuide(kind){
  // 定位教學優先：定位有問題時，不讓羅盤教學蓋掉它
  if(kind==='compass' && (gpsErr===1||gpsErr===2||($('guideMask').classList.contains('on') && guideKind==='loc'))){ compassPending=true; return; }
  guideKind=kind; guideOs=ENV.os; renderGuide();
  $('guideMask').classList.add('on'); document.body.style.overflow='hidden';
  if(kind==='loc') speak('位置被關掉了，請照畫面上的步驟打開', true);
}
function closeGuide(){ $('guideMask').classList.remove('on'); document.body.style.overflow='';
  if(guideKind==='loc' && compassPending && gpsErr===null){ compassPending=false; setTimeout(()=>openGuide('compass'),400); } }
$('guideX').addEventListener('click', closeGuide);
$('guideMask').addEventListener('click', e=>{ if(e.target===$('guideMask')) closeGuide(); });
$('gTabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; guideOs=b.dataset.os; renderGuide(); });
$('gRetry').addEventListener('click', ()=>{
  navigator.geolocation.getCurrentPosition(()=>{ closeGuide(); gpsErr=null; toast('成功拿到位置了'); if(watchId!==null) navigator.geolocation.clearWatch(watchId); startGPS(); },
    ()=>{ location.reload(); }, {enableHighAccuracy:true, timeout:10000});
});
document.querySelector('#find .status-pill').addEventListener('click', ()=>{ if(gpsErr===1||gpsErr===2) openGuide('loc'); });

// ===== 自動更新 =====
function cmpVer(a,b){ const x=a.split('.').map(Number), y=b.split('.').map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0); } return 0; }
async function checkUpdate(){
  if(!location.hostname.endsWith('github.io')) return;
  if($('find').classList.contains('on')) return;   // 找人中不要重新載入
  try{
    const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'});
    const j = await r.json();
    if(j.version && cmpVer(j.version, APP_VERSION)>0){
      const u = new URL(location.href); u.searchParams.set('v', j.version);
      location.replace(u.pathname + u.search);
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    checkUpdate();
    document.getAnimations && document.getAnimations().forEach(a=>{ try{ a.play(); }catch(e){} });
    if($('find').classList.contains('on')) keepAwake();
  }else{ try{ speechSynthesis.cancel(); }catch(e){} }
});
window.addEventListener('pageshow', e=>{ if(e.persisted) checkUpdate(); });

// ===== 更新說明（只往前記） =====
function maybeShowNews(){
  const seen = ls.get('fm_seen', null);
  if(seen===null){ ls.set('fm_seen', APP_VERSION); return; }   // 第一次使用不跳
  if(cmpVer(APP_VERSION, seen)<=0) return;
  $('newsBody').innerHTML = CHANGELOG.filter(c=>cmpVer(c.v, seen)>0)
    .map(c=>`<div class="ver">v${c.v}</div><ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>`).join('');
  $('newsMask').classList.add('on'); document.body.style.overflow='hidden';
  const cur = ls.get('fm_seen','0.0.0'); if(cmpVer(APP_VERSION,cur)>0) ls.set('fm_seen', APP_VERSION);
}
function closeNews(){ $('newsMask').classList.remove('on'); document.body.style.overflow=''; }
$('newsX').addEventListener('click', closeNews);
$('newsMask').addEventListener('click', e=>{ if(e.target===$('newsMask')) closeNews(); });

// ===== 開機 =====
function route(){
  const q = new URLSearchParams(location.search);
  if(q.has('v')){ q.delete('v'); history.replaceState(null,'', location.pathname + (q.toString()?'?'+q:'')); }
  voiceOn = ls.get('fm_voice', true); renderVoice();
  $('myName').value = ls.get('fm_name','') || '';
  $('myPhone').value = ls.get('fm_phone','') || '';
  const r = q.get('r');
  if(r && r.length>=20){
    const c = Number(q.get('c')||0);
    if(c && Date.now()-c>ROOM_TTL){ show('expired'); return; }
    roomId=r; roomCreated=c||Date.now();
    otherName = (q.get('n')||'').slice(0,8) || '對方';
    $('welTitle').textContent = `${otherName}在等你`;
    $('findTitle').textContent = `跟著箭頭找${otherName}`;
    const p=(q.get('p')||'').replace(/[^\d+]/g,'');
    if(p){ $('btnCall').href='tel:'+p; $('btnCall').style.display=''; $('callTxt').textContent='打給'+otherName; }
    show('welcome');
    if(ENV.br==='line') setTimeout(()=>openGuide('line'), 2800);
    return;
  }
  const saved = ls.get('fm_room', null);
  if(saved && saved.id && Date.now()-saved.c < ROOM_TTL){
    show('home');
    $('btnCreate').innerHTML = '<svg><use href="#icPin"/></svg>繼續分享位置';
    resumeRoom = saved;
    return;
  }
  show('home');
}
async function boot(){
  route();
  const t0 = performance.now();
  setTimeout(()=>$('boot').classList.add('go'), 150);
  const fontsReady = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r=>setTimeout(r,1200))]);
  checkUpdate();
  await fontsReady;
  const wait = Math.max(0, 2400-(performance.now()-t0));
  await Promise.race([new Promise(r=>setTimeout(r,wait)), new Promise(r=>setTimeout(r,4000))]);
  $('boot').classList.add('out');
  setTimeout(()=>{ $('boot').style.display='none'; }, 400);
  setTimeout(maybeShowNews, 700);
  requestAnimationFrame(tick);
}
// 測試用掛鉤
window.__fm = { get state(){ return {role,roomId,me,other,heading}; }, set(o){ if(o.me) me=o.me; if(o.other) other=o.other; if('heading' in o) heading=o.heading; } };
boot();
</script>
